<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nora-portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="朱若楠 Nora — B2B Marketing · Market Events · To G Projects" />
    <!-- 使用系统原生字体，无需外部加载，避免 Google Fonts 被墙导致白屏 -->
    <link rel="preload" as="image" href="/nora-portfolio/images/photos/portrait.jpg" />
    <title>朱若楠 Nora — Portfolio</title>
    <script type="module" crossorigin src="/nora-portfolio/assets/index-DbnCgLfC.js"></script>
    <link rel="stylesheet" crossorigin href="/nora-portfolio/assets/index-CzKe9-LI.css">
  </head>
  <body>
    <div id="root">
      <!-- 加载骨架屏 — JS 未加载完时显示，防止白屏 -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FAFAFA;font-family:system-ui,-apple-system,sans-serif">
        <div style="text-align:center">
          <div style="width:40px;height:40px;border:2px solid #E5E5E7;border-top-color:#1D1D1F;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>
          <div style="color:#86868B;font-size:14px">加载中...</div>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <!-- SPA 路由回退：从 404.html 恢复原始路径 -->
    <script>
      (function() {
        var p = sessionStorage.getItem('redirectPath');
        if (p && p !== '/nora-portfolio/' && p !== '/nora-portfolio') {
          sessionStorage.removeItem('redirectPath');
          var clean = p.replace(/\/nora-portfolio/, '').replace(/\/$/, '') || '/';
          history.replaceState(null, '', '/nora-portfolio/#' + clean);
        }
      })();
    </script>
  </body>
</html>
